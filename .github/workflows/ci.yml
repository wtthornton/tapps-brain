name: CI

# Minimal PR gate: lint + unit test only.
#
# Cost discipline (2026-04-27): the previous nightly schedule + cross-platform
# matrix + benchmark / eval jobs were removed.  Re-add a job here only if it
# catches a class of regression that lint + unit-test cannot.  Ad-hoc runs
# stay available via `workflow_dispatch`.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  # No paths-ignore on pull_request, deliberately.  `lint` and `test` are
  # required status checks on `main`, and a required check that never reports
  # blocks a PR forever — so a docs-only PR under a paths filter could not be
  # merged at all.  The cost is one lint+test run on doc-only PRs; a gate that
  # can be silently skipped is not a gate.  `push` keeps its filter.
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy --strict src/tapps_brain/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: tapps
          POSTGRES_PASSWORD: tapps
          POSTGRES_DB: tapps_brain_dev
        options: >-
          --health-cmd "pg_isready -U tapps -d tapps_brain_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s
    env:
      # Single DSN — Hive + Federation inherit. CI connects as the owner role
      # because the tests include schema migrations; TAPPS_BRAIN_ALLOW_PRIVILEGED_ROLE
      # is the documented override for CI/dev. Production uses tapps_runtime.
      TAPPS_BRAIN_DATABASE_URL: postgresql://tapps:tapps@localhost:5432/tapps_brain_dev
      TAPPS_TEST_POSTGRES_DSN: postgresql://tapps:tapps@localhost:5432/tapps_brain_dev
      TAPPS_BRAIN_ALLOW_PRIVILEGED_ROLE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Cache HuggingFace models (BAAI/bge-small-en-v1.5)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-models-bge-small-en-v1.5-${{ runner.os }}
          restore-keys: hf-models-bge-small-en-v1.5-
      - run: uv sync --group dev --python 3.12
      - name: Pre-download sentence-transformers model
        env:
          HF_DATASETS_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
          HF_HUB_OFFLINE: "0"
        run: uv run python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-small-en-v1.5')"
      - name: Apply schema migrations
        run: uv run python scripts/apply_all_migrations.py
      # The RLS and tenant-isolation tests connect as the non-owner
      # `tapps_runtime` role, because that is the only identity row-level
      # security is actually enforced against. `apply_all_migrations.py` applies
      # private/hive/federation schemas and never roles, so without this step
      # those tests fail on password authentication — surfacing as
      # `psycopg_pool.PoolTimeout` once the pool exhausts its connect retries,
      # which reads as a pool bug rather than a missing credential (TAP-5846).
      #
      # Same SQL file the production migrate sidecar applies
      # (docker/migrate-entrypoint.sh), so the role definitions have one home.
      # The password is a throwaway matching what the tests string-replace into
      # their DSN; this database is destroyed with the runner.
      - name: Provision runtime roles
        run: |
          psql "$TAPPS_BRAIN_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f src/tapps_brain/migrations/roles/001_db_roles.sql
          psql "$TAPPS_BRAIN_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE tapps_runtime WITH LOGIN PASSWORD 'tapps_runtime';"
      # Unit tests — the primary gate.
      # The class of bug v3.20.1 hotfixed (tool catalog ↔ snapshot drift) is
      # covered by the e2e Docker stack in `hive-smoke.yml`; widened triggers
      # there ensure any change to `mcp_server/`, `http/`, or `services/`
      # exercises it.
      - run: uv run pytest tests/unit/ -v --tb=short -m "not benchmark"
      # Full integration + compat suites (TAP-5459, closing TAP-2803).
      #
      # This step used to name 19 mock-based files explicitly, excluding every
      # DB-dependent file (tenant isolation, RLS, migrations, postgres backends)
      # and the compat/openapi-snapshot suites as "known pre-existing failures".
      # Those failures are gone. Most were never code failures at all: they were
      # a dev/CI database with no `tapps_runtime` role, fixed in TAP-5846. The
      # rest were repaired by intervening work.
      #
      # Measured against a correctly provisioned database before widening:
      # tests/integration/ = 697 passed, 13 skipped, 0 failed across three
      # consecutive runs in randomised order; tests/compat/ = 57 passed.
      #
      # The explicit list existed so a new red test could not silently ride in
      # under a directory glob. That protection now comes from the directory
      # being green in the first place — an allowlist that excludes most of the
      # suite protects nothing, and it is what let TAP-2727's KG status-code
      # drift, and later a red test_profile_filter.py, sit on `main`.
      #
      # Anything genuinely unrunnable here must skip behind an explicit guard
      # in the test itself, so the reason travels with the test rather than
      # living in this file.
      - name: Integration + compat tests (live Postgres)
        run: >-
          uv run pytest -q --tb=short -m "not benchmark"
          tests/integration/ tests/compat/

# Removed in the 2026-04-27 cost-discipline pass:
#   - eval-golden, benchmark-smoke (nightly cron via `schedule:`)
#   - test-cross-platform (macos-latest + windows-latest matrix; Mac/Windows
#     runners cost ~10x ubuntu minutes on private repos)
# Run them locally when needed:
#   uv run python scripts/run_eval_golden.py --output eval-report.json
#   uv run python scripts/run_benchmark.py locomo --dataset tests/benchmarks/fixtures/locomo_fixture.json
#   uv run pytest tests/unit/ -v --tb=short -m "not benchmark"  # cross-platform smoke
