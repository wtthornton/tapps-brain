# docs-mcp configuration for tapps-brain.
#
# This file is the canonical manifest for `docs_check_drift` ignore patterns.
# docs-mcp auto-loads `drift_ignore_patterns` from `.docsmcp.yaml` when
# `docs_check_drift` is called with an EMPTY `ignore_patterns` argument — so the
# canonical clean run is simply `docs_check_drift()` with no arguments. (TAP-2768:
# an earlier note here claimed the file was not auto-loaded; that is no longer
# true. An explicit `ignore_patterns` value still WINS and bypasses this list —
# notably `ignore_patterns="defaults"` uses ONLY docs-mcp's built-in private/test
# globs and will re-flag the internal constants below, so do not use it for a
# clean audit. Call with no `ignore_patterns` instead.)
#
# Patterns are fnmatch globs on fully-qualified symbol names (e.g.
# `tapps_brain.module.NAME`). The literal string `defaults` opts into
# docs-mcp's built-in private/test list (`_*`, `test_*`, `tests.*`, etc.) and is
# kept as the first entry below so the config list is a superset of the defaults.
#
# When updating: re-run `docs_check_drift` (no args) and confirm only signal remains.

drift_ignore_patterns:
  - defaults

  # One-off scripts and example code — never user-facing.
  - "scripts.*"
  - "examples.*"

  # Internal OTel tracing constants. Documented in tapps_brain/otel_tracer.py's
  # module docstring (allowed-attribute table). User-facing observability docs
  # reference the OTel semantic-convention *values*, not the Python identifiers.
  - "tapps_brain.otel_tracer.SPAN_*"
  - "tapps_brain.otel_tracer.ATTR_*"
  - "tapps_brain.otel_tracer.GEN_AI_*"
  - "tapps_brain.otel_tracer.W3C_*"
  - "tapps_brain.otel_tracer.MCP_META_KEY"

  # Internal env-var / header name constants. The actual env-var and header
  # *values* (TAPPS_BRAIN_INTEGRITY_KEY_REGENERATE, X-Tapps-Project,
  # TAPPS_BRAIN_PROJECT) are documented in postgres-dsn.md, agent-playbook.md,
  # and module docstrings. The scanner flags the Python identifier, which is
  # internal and uninteresting to readers.
  - "tapps_brain.integrity.INTEGRITY_KEY_REGENERATE_ENV"
  - "tapps_brain.project_resolver.HEADER_NAME"
  - "tapps_brain.project_resolver.ENV_VAR"
  - "tapps_brain.project_resolver.DEFAULT_PROJECT_ID"
  - "tapps_brain.http.middleware.MCP_AUTH_EXPECTED_ENV"

  # Privacy mode name constants. The mode *values* (standard/strict/local) are
  # documented in visual-snapshot.md; the Python identifiers are internal.
  - "tapps_brain.visual_snapshot.PRIVACY_*"

  # Internal SQL templates for the KG store. Documented in postgres_kg.py and
  # async_postgres_kg.py module docstrings — not user-facing.
  - "tapps_brain._postgres_kg_sql.*"

  # Private CLI helper.
  - "tapps_brain.cli._common._PREVIEW_LEN"
