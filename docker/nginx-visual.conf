# nginx config for tapps-brain visual dashboard container
# Proxies /snapshot to the HttpAdapter so browser fetch is same-origin (no CORS)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # STORY-078.5: liveness for tapps-visual itself (no brain upstream).
    location = /healthz {
        default_type application/json;
        add_header Content-Type application/json always;
        return 200 '{"ok":true,"service":"tapps-visual"}';
    }

    # Proxy /snapshot → HttpAdapter (tapps-brain-mcp:8080)
    # resolver 127.0.0.11 is Docker's embedded DNS; required for variable proxy_pass
    # The Authorization header is injected at container start by docker/visual-entrypoint.sh,
    # which reads the token from the mounted secret and substitutes the placeholder below.
    location /snapshot {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://tapps-brain-http:8080;
        proxy_pass $upstream/snapshot;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer __TAPPS_HTTP_AUTH_TOKEN__";
        proxy_set_header X-Project-Id "__TAPPS_HTTP_PROJECT_ID__";
        # Match brain_smoke_live.sh urllib timeout (30s); cold snapshot SLO ≤25s.
        proxy_read_timeout 30s;
        proxy_connect_timeout 30s;
        proxy_cache_bypass 1;
        # Structured JSON for upstream/gateway failures (STORY-078.4); 200 responses pass through.
        proxy_intercept_errors on;
        error_page 502 =502 @snapshot_upstream_error_502;
        error_page 503 =503 @snapshot_upstream_error_503;
        error_page 504 =504 @snapshot_upstream_error_504;
        add_header Cache-Control "no-store" always;
    }

    location @snapshot_upstream_error_502 {
        internal;
        default_type application/json;
        add_header Content-Type application/json always;
        return 502 '{"error":"upstream_timeout","upstream":"tapps-brain-http"}';
    }

    location @snapshot_upstream_error_503 {
        internal;
        default_type application/json;
        add_header Content-Type application/json always;
        return 503 '{"error":"upstream_timeout","upstream":"tapps-brain-http"}';
    }

    location @snapshot_upstream_error_504 {
        internal;
        default_type application/json;
        add_header Content-Type application/json always;
        return 504 '{"error":"upstream_timeout","upstream":"tapps-brain-http"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
