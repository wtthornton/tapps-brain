# tapps-brain — unified Docker deployment (2026 architecture, ADR-007).
#
# ONE container (tapps-brain-http) serves private memory + Hive + Federation
# on the same /mcp/ + /v1/* API, backed by ONE Postgres addressed by
# TAPPS_BRAIN_DATABASE_URL. Hive is a feature of tapps-brain, not a separate
# service — there is no separate hive-db, hive-dsn, or hive-migrate. See
# docs/guides/hive.md and docs/guides/hive-deployment.md.
#
# Setup:
#   1. cp docker/.env.example docker/.env
#   2. Fill in docker/.env with strong values:
#        TAPPS_BRAIN_DB_PASSWORD=$(openssl rand -base64 32)
#        TAPPS_BRAIN_AUTH_TOKEN=$(openssl rand -hex 32)
#        TAPPS_BRAIN_ADMIN_TOKEN=$(openssl rand -hex 32)
#   3. From repo root:
#        docker compose -p tapps-brain -f docker/docker-compose.hive.yaml up -d --build
#
# Endpoints after start:
#   http://localhost:8080   — HTTP data plane + /mcp/ + /admin/*
#                             (public auth: Bearer TAPPS_BRAIN_AUTH_TOKEN)
#   http://127.0.0.1:8090   — operator MCP transport (admin-only, loopback)
#                             (admin auth: Bearer TAPPS_BRAIN_ADMIN_TOKEN)
#   http://localhost:8088   — nginx dashboard (reads /snapshot on the brain)
#
# The file name keeps the legacy `.hive.` suffix for backward compatibility
# with scripts and docs that reference it; the file's CONTENTS are the 2026
# unified shape.

services:
  tapps-brain-db:
    image: pgvector/pgvector:pg17
    container_name: tapps-brain-db
    environment:
      POSTGRES_DB: tapps_brain
      POSTGRES_USER: tapps
      POSTGRES_PASSWORD: ${TAPPS_BRAIN_DB_PASSWORD:?set TAPPS_BRAIN_DB_PASSWORD in docker/.env}
    volumes:
      - tapps-brain-pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapps -d tapps_brain"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot bootstrap sidecar. Schema-migration DDL runs as the de-privileged
  # tapps_migrator role (TAPPS_BRAIN_DATABASE_URL); a short privileged bootstrap
  # (TAPPS_BRAIN_MIGRATE_BOOTSTRAP_DSN, the superuser) only de-privileges the
  # migrator, reassigns ownership of the tenanted tables to it, applies the
  # runtime/readonly grants, and sets role passwords. After exit the brain
  # connects as tapps_runtime (non-privileged) and the migrate path no longer
  # sets TAPPS_BRAIN_ALLOW_PRIVILEGED_ROLE — no "tenant isolation NOT enforced"
  # audit line on deploy (TAP-2686).
  #
  # NOTE: the ${...:?...} guards below are enforced at `docker compose up` time.
  # If you add or rename a required env var here, update scripts/hive_smoke.sh's
  # docker/.env heredoc to mint and write it too — otherwise the Hive Stack
  # Smoke Test workflow goes red on every PR (TAP-1100).
  tapps-brain-migrate:
    image: docker-tapps-brain-migrate:${BRAIN_VERSION:-latest}
    container_name: tapps-brain-migrate
    build:
      context: ..
      dockerfile: docker/Dockerfile.migrate
    environment:
      # De-privileged migrator DSN — used for all schema-migration DDL.
      TAPPS_BRAIN_DATABASE_URL: "postgres://tapps_migrator:${TAPPS_BRAIN_MIGRATOR_PASSWORD}@tapps-brain-db:5432/tapps_brain"
      # Superuser DSN — used only for the one-time privileged bootstrap.
      TAPPS_BRAIN_MIGRATE_BOOTSTRAP_DSN: "postgres://tapps:${TAPPS_BRAIN_DB_PASSWORD}@tapps-brain-db:5432/tapps_brain"
      TAPPS_BRAIN_MIGRATOR_PASSWORD: ${TAPPS_BRAIN_MIGRATOR_PASSWORD:?set TAPPS_BRAIN_MIGRATOR_PASSWORD in docker/.env}
      TAPPS_BRAIN_RUNTIME_PASSWORD: ${TAPPS_BRAIN_RUNTIME_PASSWORD:?set TAPPS_BRAIN_RUNTIME_PASSWORD in docker/.env}
    depends_on:
      tapps-brain-db:
        condition: service_healthy
    restart: "no"

  # The unified brain: HTTP data plane + /mcp/ + admin API on :8080, operator
  # MCP transport on :8090 (loopback by default). Private memory, Hive, and
  # Federation all share one DSN — set TAPPS_BRAIN_HIVE_DSN or
  # TAPPS_BRAIN_FEDERATION_DSN only for advanced split-DB deployments.
  tapps-brain-http:
    image: docker-tapps-brain-http:${BRAIN_VERSION:-latest}
    container_name: tapps-brain-http
    build:
      context: ..
      dockerfile: docker/Dockerfile.http
    environment:
      # Brain connects as the DML-only tapps_runtime role. The owner role
      # (tapps) only runs during the one-shot migrate sidecar — by the time
      # the brain starts, tapps_runtime exists with its password set, and
      # RLS applies because this role is not BYPASSRLS and owns no tables.
      TAPPS_BRAIN_DATABASE_URL: "postgres://tapps_runtime:${TAPPS_BRAIN_RUNTIME_PASSWORD}@tapps-brain-db:5432/tapps_brain"
      TAPPS_BRAIN_HTTP_HOST: "0.0.0.0"
      TAPPS_BRAIN_HTTP_PORT: "8080"
      TAPPS_BRAIN_MCP_HTTP_PORT: "${TAPPS_OPERATOR_MCP_PORT:-8090}"
      TAPPS_BRAIN_MCP_HOST: "0.0.0.0"
      TAPPS_BRAIN_AUTH_TOKEN: ${TAPPS_BRAIN_AUTH_TOKEN:?set TAPPS_BRAIN_AUTH_TOKEN in docker/.env}
      TAPPS_BRAIN_ADMIN_TOKEN: ${TAPPS_BRAIN_ADMIN_TOKEN:?set TAPPS_BRAIN_ADMIN_TOKEN in docker/.env}
      TAPPS_BRAIN_ALLOWED_ORIGINS: "${TAPPS_BRAIN_ALLOWED_ORIGINS:-}"
      # mcp SDK 1.27.0 enables DNS-rebinding protection by default with an
      # empty allow-list, so any Host header (including the Docker service
      # DNS name) logs `Invalid Host header` from transport_security.py.
      # Wire an explicit allow-list covering the in-network service name and
      # loopback so the warnings stop and we are not relying on the SDK's
      # back-compat fallback (which a future mcp release may remove).
      TAPPS_BRAIN_MCP_ALLOWED_HOSTS: "${TAPPS_BRAIN_MCP_ALLOWED_HOSTS:-tapps-brain-http:8080,tapps-brain-http:8090,localhost:8080,localhost:8090,127.0.0.1:8080,127.0.0.1:8090}"
      TAPPS_BRAIN_STRICT: "1"
      # TAP-1076 — production-hardening passthroughs.  Default to empty so
      # the dev stack still boots without these set, but the runtime emits a
      # one-shot startup warning per unset variable so operators see the gap
      # in the logs.  See docs/guides/hive-deployment.md "Production
      # hardening checklist" for the recommended values.
      #
      # /metrics token gate (TAP-547 — already wired in the runtime; this
      # only propagates the operator's value into the container).  When
      # unset, /metrics is callable unauthenticated and serves a
      # tenant-label-redacted body.  Set TAPPS_BRAIN_METRICS_TOKEN_FILE
      # instead to read the token from a file so it never enters the
      # process environment.
      TAPPS_BRAIN_METRICS_TOKEN: "${TAPPS_BRAIN_METRICS_TOKEN:-}"
      TAPPS_BRAIN_METRICS_TOKEN_FILE: "${TAPPS_BRAIN_METRICS_TOKEN_FILE:-}"
      # HuggingFace Hub token — when unset, model-cache misses (cold container,
      # cache eviction) hit the unauthenticated rate limit and the embedding
      # provider stalls until the limit window resets.  Required for any
      # production deployment with cache-rebuild risk.
      HF_TOKEN: "${HF_TOKEN:-}"
      # TAP-2672 — embedding provider config.  sentence-transformers is a core
      # dep and the brain auto-loads BAAI/bge-small-en-v1.5 (384-dim) at startup,
      # populating the pgvector `embedding` column on every write.  REQUIRED=1
      # makes the brain refuse to start if the provider can't load, so the
      # "semantic recall silently degraded to BM25" drift the 2026-05-28 audit
      # found can never recur.  Set to 0 only to intentionally run lexical-only.
      # MODEL_OFFLINE=1 forces HF_HUB_OFFLINE so the model loads from the local
      # cache with no Hub contact (pair with a warmed model cache volume).
      TAPPS_BRAIN_EMBEDDING_REQUIRED: "${TAPPS_BRAIN_EMBEDDING_REQUIRED:-1}"
      TAPPS_BRAIN_EMBEDDING_MODEL_OFFLINE: "${TAPPS_BRAIN_EMBEDDING_MODEL_OFFLINE:-0}"
      # TAP-2677 — connection-pool sizing.  The brain opens one pool per backend
      # (private / hive / federation / KG / auth / …), so without a cap the
      # single-replica deployment held 64 idle of Postgres's 100 max_connections
      # while only ~1 query was active (cache hit ratio 99.5% — latency is not
      # the constraint).  Cap min/max here; raise them for multi-replica or
      # high-fan-in (200-agent) deployments.  Monitor idle consumption via the
      # pool_saturation field in the brain health/metrics payload and alert when
      # idle backends exceed 50% of Postgres max_connections.
      TAPPS_BRAIN_PG_POOL_MIN: "${TAPPS_BRAIN_PG_POOL_MIN:-1}"
      TAPPS_BRAIN_PG_POOL_MAX: "${TAPPS_BRAIN_PG_POOL_MAX:-8}"
    volumes:
      # Persist the HuggingFace model cache across container recreations (TAP-2672).
      # The embedding model (~130MB) is downloaded on first start; without this
      # volume every redeploy re-downloads it, and with EMBEDDING_REQUIRED=1 a
      # cold-download failure (HF outage / rate limit, no HF_TOKEN) becomes a hard
      # startup failure. A persistent, pre-warmable cache makes the deploy robust;
      # pair with EMBEDDING_MODEL_OFFLINE=1 once warmed to skip Hub contact entirely.
      - tapps-brain-hfcache:/root/.cache/huggingface
    ports:
      - "${TAPPS_HTTP_PORT:-8080}:8080"
      # Operator MCP bound to loopback by default (TAP-551).
      - "${TAPPS_OPERATOR_MCP_BIND:-127.0.0.1}:${TAPPS_OPERATOR_MCP_PORT:-8090}:8090"
    depends_on:
      tapps-brain-db:
        condition: service_healthy
      tapps-brain-migrate:
        condition: service_completed_successfully
    healthcheck:
      # /healthz returns 200 only after a successful DB connection and schema
      # check (TAP-1835). This ensures `depends_on: condition: service_healthy`
      # chains wait until the brain is truly ready to serve, not just started.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  tapps-visual:
    image: docker-tapps-visual:${BRAIN_VERSION:-latest}
    container_name: tapps-visual
    build:
      context: ..
      dockerfile: docker/Dockerfile.visual
    environment:
      # Visual entrypoint injects this token into the nginx /snapshot proxy
      # so the dashboard can call the authed brain endpoint without exposing
      # the token to the browser. Same token as the public data plane.
      TAPPS_BRAIN_AUTH_TOKEN: ${TAPPS_BRAIN_AUTH_TOKEN:?set TAPPS_BRAIN_AUTH_TOKEN in docker/.env}
    ports:
      - "${TAPPS_VISUAL_PORT:-8088}:80"
    depends_on:
      tapps-brain-http:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tapps-brain-pgdata:
  # HuggingFace embedding-model cache (TAP-2672) — see the tapps-brain-http
  # volume mount. Pre-warm before a REQUIRED=1 deploy to avoid a cold download.
  tapps-brain-hfcache:
