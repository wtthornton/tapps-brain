# MCP tool profiles for tapps-brain server — EPIC-073 STORY-073.1
#
# Maps profile names → sets of tool names exposed to that profile.
# Tool names must exactly match the @mcp.tool()-decorated function names in
# src/tapps_brain/mcp_server/__init__.py.
#
# ProfileRegistry validates all names at startup — add new tools here when
# adding @mcp.tool decorators, otherwise the server will refuse to start.
#
# Profile summary:
#   full        (62 tools, 8 eager) — all standard tools; default fallback
#   operator    (75 tools, 8 eager) — full + 13 operator-only maintenance tools
#   coder       (18 tools) — repo-embedded coding agent subset (+ KG tools EPIC-076)
#   reviewer    ( 8 tools) — read-only PR/code review agents
#   seeder      ( 6 tools) — bulk ingestion scripts
#   agent_brain (12 tools) — TAP-1579 canonical agent-brain consumer surface
#                             (brain_* facade only; no memory_*/hive_*/feedback_*)
#
# Canonical surface split (TAP-1579):
#   agent-brain consumers (AgentBrain class, embedded agents) → `agent_brain`
#     profile. Sees only `brain_*` tools — the high-level facade. Memory-layer
#     `memory_*` tools, Hive `hive_*` tools, and admin tools are hidden.
#   full-access consumers (operator scripts, full-fidelity clients) → `full`
#     or `operator` profile. Sees the low-level surface.
#   Coding agents that need session capture + reinforcement → `coder` profile
#     (brain_* facade + memory_capture / memory_index_session / memory_reinforce).
#
# defer_loading (TAP-1985, parent epic TAP-1983):
#   Tools in `full` / `operator` annotated as `{name: ..., defer_loading: true}`
#   are still REGISTERED and CALLABLE — they're omitted from the default
#   `tools/list` response to shrink the eager catalog from 59 → 8. Clients that
#   adopt Anthropic Tool Search BETA (opt-in via `advanced-tool-use-2025-11-20`)
#   discover deferred tools on demand. Eager budget per server is 8–12 (parent
#   epic budget).

profiles:
  # --------------------------------------------------------------------------
  # full — all standard tools (default fallback, backwards-compatible)
  # 62 tools total: 8 eager daily drivers + 54 deferred (TAP-2094: +recall_quality_metrics)
  #
  # Daily-driver budget (8) — eager catalog returned by `tools/list` when no
  # Tool Search BETA header is present. Picked for highest call frequency in
  # the brain_* facade + the two cross-cutting search primitives.
  # --------------------------------------------------------------------------
  full:
    description: >
      All standard (non-operator) tools. Default profile when no X-Brain-Profile
      header is set. Includes all brain_* facade tools + KG tools (EPIC-076).
      Eager catalog (`tools/list`) returns the 8 daily-driver tools; the
      remaining 54 carry `defer_loading: true` and are reachable via Tool Search
      BETA (parent epic TAP-1983).
    tools:
