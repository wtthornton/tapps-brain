  # --------------------------------------------------------------------------
  # coder — repo-embedded coding agent (18 tools)
  # 6 facade + 4 hook-callable + 3 quality loop + 5 cross-repo/graph (EPIC-076 KG + TAP-1973 batch)
  # --------------------------------------------------------------------------
  coder:
    description: >
      Repo-embedded coding agent subset. Exposes the brain_* facade, session
      hooks, quality-loop tools, and cross-repo graph lookups. The KG
      discovery primitives — `memory_find_related(key, max_hops=2)` for
      memory-to-memory traversal and `brain_get_neighbors(entity_ids, hops=2)`
      for entity-graph traversal — answer "what else does this file / rule
      touch?" without dragging in the full memory_* admin surface. Use
      `brain_explain_connection` to verify a hypothesised path between two
      entities. Intentionally excludes destructive ops (memory_delete,
      agent_delete, etc.) and bulk admin tools to reduce context-bloat and
      attack surface.
    tools:
      # Facade (6) — primary agent API
      - brain_recall
      - brain_remember
      - brain_forget
      - brain_learn_success
      - brain_learn_failure
      - brain_status
      # Hook-callable (4) — invoked by SessionStart / SessionEnd hooks
      - memory_index_session
      - memory_capture
      - tapps_brain_session_end
      - memory_search_sessions
      # Quality loop (3) — reinforcement + feedback
      - memory_reinforce
      - feedback_rate
      - feedback_gap
      # Cross-repo + graph (5) — Hive and relation lookups + KG tools
      - hive_search
      - memory_find_related
      - brain_get_neighbors
      - brain_explain_connection
      - brain_record_events_batch

  # --------------------------------------------------------------------------
  # reviewer — read-only PR/code review agents (8 tools)
  # --------------------------------------------------------------------------
  reviewer:
    description: >
      Read-only subset for PR/code review agents. No writes, no deletes.
      Provides recall, search, and graph traversal only.
    tools:
      - brain_recall
      - hive_search
      - memory_find_related
      - memory_get
      - memory_list
      - memory_relations
      - memory_search
      - memory_search_sessions

  # --------------------------------------------------------------------------
  # seeder — bulk ingestion scripts (6 tools)
  # --------------------------------------------------------------------------
  seeder:
    description: >
      Bulk write subset for one-shot ingestion scripts. No read ops beyond
      status. Intended for pipeline agents that bulk-populate memory before
      a coding session starts.
    tools:
      - brain_status
      - memory_capture
      - memory_ingest
      - memory_save
      - memory_save_many
      - memory_supersede

  # --------------------------------------------------------------------------
  # agent_brain — canonical AgentBrain consumer surface (11 tools) — TAP-1579
  # Exposes only the `brain_*` facade. Agents using the AgentBrain class never
  # need the low-level `memory_*`, `hive_*`, `feedback_*`, `agent_*`, or
  # `maintenance_*` tools — hiding them reduces context bloat and enforces the
  # architectural boundary between the facade and the storage layer.
  # --------------------------------------------------------------------------
  agent_brain:
    description: >
      Canonical agent-brain consumer surface. Exposes only the high-level
      brain_* facade (remember / recall / forget / learn_success /
      learn_failure / status, plus the KG and event helpers). Excludes all
      memory_*, hive_*, feedback_*, agent_*, and maintenance_* tools. Intended
      for any agent that uses the AgentBrain class or speaks to tapps-brain
      via the brain_* facade only.
    tools:
      - brain_audit_consumers
      - brain_explain_connection
      - brain_forget
      - brain_get_neighbors
      - brain_learn_failure
      - brain_learn_success
      - brain_recall
      - brain_record_event
      - brain_record_events_batch
      - brain_record_feedback
      - brain_remember
      - brain_status
